server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1k;   # static site — nothing is uploaded

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Coolify's proxy terminates TLS in front of this container.

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Kit images from the mounted volume (no directory listing, no dotfiles).
    location /kits/ {
        alias /srv/kits/;
        autoindex off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        location ~ /\. { deny all; }
    }

    # Regenerated whenever kits change — always revalidate.
    location = /kits/manifest.json {
        alias /srv/kits/manifest.json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall back to index.html, which must not be cached.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
