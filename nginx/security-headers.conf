# Included in every location: an add_header inside a location drops all inherited ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Stadium photos are hotlinked from Wikimedia Commons, fonts come from Google Fonts.
# If kits move to another host (VITE_KITS_BASE_URL), add it to img-src and connect-src.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://commons.wikimedia.org https://upload.wikimedia.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
